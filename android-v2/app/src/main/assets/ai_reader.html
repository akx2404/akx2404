<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Akshad's Learning Cave</title><style>
:root{--bg:#15100d;--card:#261a14;--paper:#f4e7ca;--ink:#21160f;--gold:#f3a33b;--muted:#b7a28d;--line:#ffffff1c;--accent:#c66a55}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:white;font-family:system-ui,-apple-system,sans-serif}button,input{font:inherit;touch-action:manipulation}.app{min-height:100vh;background:radial-gradient(circle at 85% 0,#67382055,transparent 35%),linear-gradient(#211711,#15100d)}header{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line);background:#17110e}.back{width:44px;height:44px;border-radius:50%;border:1px solid #ffffff24;background:#2a1d17;color:#fff;font-size:27px}.brand{font:700 20px/1.05 Georgia,serif}.sub{font-size:11px;color:var(--muted);margin-top:4px}.lang{display:flex;border:1px solid #ffffff22;border-radius:999px;padding:3px;background:#2a1d17}.lang button{border:0;border-radius:999px;padding:8px 9px;background:transparent;color:#cdb9a4;font-size:11px;font-weight:900}.lang button.active{background:var(--gold);color:#21150d}main{max-width:780px;margin:auto;padding:18px 15px 90px}.hero{padding:26px;border-radius:28px;background:linear-gradient(140deg,#4b2b1c,#251710 68%,#6a2c13);border:1px solid #ffffff1f}.hero h1{font:700 39px/1.03 Georgia,serif;margin:0 0 15px}.hero p{font-size:16px;line-height:1.5;color:#eadaca}.datebar{display:flex;gap:9px;overflow:auto;margin:18px 0}.datebar button{white-space:nowrap;border:1px solid #ffffff20;background:#281b15;color:#fff;border-radius:999px;padding:11px 14px}.datebar button.active{background:var(--gold);color:#24160d;font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.topic{border:1px solid #ffffff18;border-radius:24px;background:linear-gradient(145deg,#2b1e17,#19110e);color:white;text-align:left;padding:17px;min-height:195px;display:flex;flex-direction:column}.topic:active{transform:scale(.985)}.topic .icon{font-size:31px}.topic h3{font:700 20px/1.1 Georgia,serif;margin:12px 0 7px}.topic p{font-size:13px;line-height:1.35;color:var(--muted);margin:0}.chips{display:flex;gap:6px;margin-top:auto;padding-top:14px}.chip{font-size:10px;padding:6px 8px;border-radius:999px;border:1px solid #ffffff20;color:#d8c2ab}.chip.done{border-color:#f3a33b77;color:#ffd48d;background:#f3a33b12}.loading{text-align:center;padding:90px 20px}.loading b{display:block;font-size:54px;margin-bottom:12px}.paper{background:var(--paper);color:var(--ink);border:4px solid #21170f;box-shadow:7px 8px 0 #070504;border-radius:27px;padding:22px;margin:19px 0}.paper h1,.paper h2{font-family:Georgia,serif}.paper h1{font-size:37px;line-height:1.06}.paper h2{font-size:28px}.paper p{font:18px/1.72 Georgia,serif;white-space:pre-line}.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#a4442c;font-weight:900}.meta{font:13px/1.45 system-ui!important;color:#6d5945}.comic{margin:17px -4px}.comic img{width:100%;display:block;border:4px solid #25170f;border-radius:20px;background:#dac8a6}.interaction{border:3px dashed var(--accent);border-radius:20px;padding:16px;background:#fff7e6;margin:18px 0}.interaction h3{font-family:Georgia,serif;margin:0 0 12px}.choices{display:grid;gap:8px}.choices button{border:2px solid #3c2a1e;background:#fffdf5;color:#24180f;border-radius:14px;padding:13px;text-align:left;font-weight:800}.choices button.selected{background:#ffd493}.reveal{display:none;margin-top:13px;border-left:5px solid var(--accent);padding:12px;background:#e5d5b6;line-height:1.5}.reveal.show{display:block}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions button,.quiz button{border:0;border-radius:14px;padding:13px 15px;font-weight:900}.primary{background:var(--gold);color:#24160d}.secondary{background:#2a1d17;color:white}.quiz{background:var(--paper);color:var(--ink);border:4px solid #21170f;box-shadow:7px 8px 0 #070504;border-radius:27px;padding:21px}.progress{height:8px;background:#d3c29f;border-radius:99px;overflow:hidden}.progress span{height:100%;display:block;background:#668d4f}.scenario{font:18px/1.55 Georgia,serif;background:#fff8e9;border-radius:15px;padding:14px}.option{width:100%;margin:8px 0;text-align:left;border:2px solid #493528!important;background:#fffdf5!important;color:#21160f!important}.option.correct{background:#ddecbd!important}.option.wrong{background:#f2c6bc!important}.feedback{display:none;background:#ded0ae;border-left:6px solid #668d4f;padding:13px;margin:12px 0;line-height:1.5}.feedback.show{display:block}.offline{padding:14px;border-radius:16px;background:#703d29;margin:12px 0}.empty{text-align:center;padding:65px 20px;color:#dbc7b1}@media(max-width:430px){header{grid-template-columns:43px minmax(0,1fr) auto;padding:11px 9px}.brand{font-size:17px}.sub{font-size:9px}.lang button{padding:7px}.hero h1{font-size:35px}.grid{gap:9px}.topic{min-height:181px;padding:14px}.topic h3{font-size:17px}.paper{padding:17px}.paper p{font-size:17px}}
</style></head><body><div class="app"><header><button class="back" id="back">‹</button><div><div class="brand">Akshad's Learning Cave</div><div class="sub" id="sub">Ten new journeys every day</div></div><div class="lang"><button data-lang="en">EN</button><button data-lang="mr">मराठी</button></div></header><main id="root"></main></div><script>
const BASE='https://raw.githubusercontent.com/akx2404/akx2404/build-learning-cave-v2-direct/daily';
const ICONS={'psychology':'🧠','sociology':'🌐','game-theory':'♟️','history-mysteries':'🕯️','political-nature':'👑','mind-glitches':'🌀','psychoanalysis':'🛋️','philosophy':'🏛️','culture':'🎭','mythology':'🐉'};
const UI={en:{sub:'Ten new journeys every day',hero:'Today’s chambers',desc:'Ten original illustrated lessons about the human mind and the worlds it creates.',read:'Read',unread:'Unread',quiz:'Quiz',open:'Open journey',mark:'Mark as read',take:'Take challenge',minutes:'min read',loading:'Opening today’s cave…',offline:'You are offline. Showing downloaded days.',missing:'This day has not been downloaded yet.',think:'What do you predict?',reveal:'Reveal',correct:'Correct',wrong:'Not quite',next:'Next',finish:'Finish',back:'Back'},mr:{sub:'दररोज दहा नवीन ज्ञानप्रवास',hero:'आजच्या ज्ञानगुहा',desc:'मानवी मन आणि त्याने घडवलेल्या जगांवरील दहा मूळ चित्रमय धडे.',read:'वाचले',unread:'न वाचलेले',quiz:'प्रश्नमंजुषा',open:'प्रवास उघडा',mark:'वाचले म्हणून नोंदवा',take:'आव्हान सुरू करा',minutes:'मिनिटांचा धडा',loading:'आजची ज्ञानगुहा उघडत आहे…',offline:'इंटरनेट उपलब्ध नाही. डाउनलोड केलेले दिवस दाखवत आहोत.',missing:'हा दिवस अजून डाउनलोड झालेला नाही.',think:'तुमचा अंदाज काय?',reveal:'उत्तर उघडा',correct:'बरोबर',wrong:'पुन्हा विचार करा',next:'पुढे',finish:'पूर्ण करा',back:'मागे'}};
const root=document.getElementById('root'),sub=document.getElementById('sub');let lang=localStorage.caveLang==='mr'?'mr':'en',selected=null,current=null,view='home',qIndex=0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=(k,d={})=>{try{return JSON.parse(localStorage[k]||JSON.stringify(d))}catch{return d}},save=(k,v)=>{try{localStorage[k]=JSON.stringify(v)}catch{}};
function setLang(){document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));sub.textContent=UI[lang].sub}
document.querySelector('.lang').onclick=e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.lang;localStorage.caveLang=lang;setLang();render()};document.getElementById('back').onclick=()=>goBack();
function goBack(){if(view==='quiz'){view='lesson';renderLesson()}else if(view==='lesson'){view='home';current=null;renderHome()}else return false;return true}window.caveBack=goBack;
async function fetchJson(url){const r=await fetch(url+'?v='+Date.now());if(!r.ok)throw Error(r.status);return r.json()}
function cache(){return load('aiDailyCache',{})}function put(date,data){const c=cache();c[date]=data;Object.keys(c).sort().slice(0,-5).forEach(k=>delete c[k]);save('aiDailyCache',c)}
async function initial(){root.innerHTML=`<div class="loading"><b>🦇</b><h2>${UI[lang].loading}</h2></div>`;let latest;try{latest=await fetchJson(BASE+'/latest.json')}catch{const ds=Object.keys(cache()).sort();latest={date:ds.at(-1)}}if(!latest?.date){root.innerHTML=`<div class="empty">${UI[lang].missing}</div>`;return}selected=latest.date;await loadDay(selected);renderHome()}
async function loadDay(d){const c=cache();if(c[d])return c[d];try{const data=await fetchJson(`${BASE}/${d}/manifest.json`);put(d,data);return data}catch{return null}}
function dates(){const c=Object.keys(cache()).sort().reverse();return [...new Set([selected,...c])].filter(Boolean).slice(0,5)}
async function renderHome(){view='home';current=null;const data=await loadDay(selected),p=load('aiProgress',{});if(!data){root.innerHTML=`<div class="empty"><h2>${UI[lang].missing}</h2><p>${UI[lang].offline}</p></div>`;return}root.innerHTML=`<section class="hero"><h1>${UI[lang].hero}</h1><p>${UI[lang].desc}</p></section><div class="datebar">${dates().map(d=>`<button data-date="${d}" class="${d===selected?'active':''}">${new Date(d+'T00:00:00').toLocaleDateString(lang==='mr'?'mr-IN':'en-IN',{day:'numeric',month:'short'})}</button>`).join('')}</div><section class="grid">${data.lessons.map((l,i)=>{const s=p[`${selected}|${l.id}`]||{};return `<button class="topic" data-i="${i}"><div class="icon">${ICONS[l.id]||'✨'}</div><h3>${esc(lang==='mr'?l.chamberMr:l.chamber)}</h3><p>${esc(lang==='mr'?l.marathi.title:l.title)}</p><div class="chips"><span class="chip ${s.read?'done':''}">${s.read?'✓ '+UI[lang].read:UI[lang].unread}</span><span class="chip ${s.quiz?'done':''}">${s.quiz?'✓ ':''}${UI[lang].quiz}</span></div></button>`}).join('')}</section>`;root.querySelector('.datebar').onclick=async e=>{const b=e.target.closest('[data-date]');if(!b)return;selected=b.dataset.date;await loadDay(selected);renderHome()};root.querySelector('.grid').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;current=data.lessons[+b.dataset.i];view='lesson';renderLesson()}}
function languageLesson(){return lang==='mr'?current.marathi:current.english}
function imgUrl(f){return `${BASE}/${selected}/${f}`}
function renderLesson(){const l=languageLesson(),progress=load('aiProgress',{}),key=`${selected}|${current.id}`,st=progress[key]||{};let imageMap={};current.images.forEach(x=>(imageMap[x.placement]??=[]).push(x));root.innerHTML=`<section class="paper"><div class="eyebrow">${esc(lang==='mr'?current.chamberMr:current.chamber)}</div><h1>${esc(lang==='mr'?current.marathi.title:current.title)}</h1><p class="meta">${esc(lang==='mr'?current.marathi.subtitle:current.subtitle)} · ${current.readingMinutes} ${UI[lang].minutes}</p><p>${esc(l.opening)}</p><div class="actions"><button id="read" class="primary">${st.read?'✓ '+UI[lang].read:UI[lang].mark}</button><button id="quiz" class="secondary">${UI[lang].take}</button></div></section>${l.sections.map((s,i)=>`${(imageMap[i]||[]).map(x=>`<figure class="comic"><img loading="lazy" src="${imgUrl(x.file)}" alt="${esc(x.alt)}"></figure>`).join('')}<article class="paper"><div class="eyebrow">${i+1} / ${l.sections.length}</div><h2>${esc(s.heading)}</h2><p>${esc(s.body)}</p><div class="interaction"><h3>${UI[lang].think}</h3><p>${esc(s.interaction.question)}</p><div class="choices">${s.interaction.options.map((o,j)=>`<button data-choice="${j}">${esc(o)}</button>`).join('')}</div><button class="primary show-reveal">${UI[lang].reveal}</button><div class="reveal">${esc(s.interaction.reveal)}</div></div></article>`).join('')}<section class="paper"><div class="eyebrow">Takeaway</div><p>${esc(l.takeaway)}</p></section>`;root.querySelector('#read').onclick=()=>{const p=load('aiProgress',{});p[key]={...(p[key]||{}),read:true};save('aiProgress',p);root.querySelector('#read').textContent='✓ '+UI[lang].read};root.querySelector('#quiz').onclick=()=>{view='quiz';qIndex=0;renderQuiz()};root.querySelectorAll('.choices').forEach(box=>box.onclick=e=>{const b=e.target.closest('[data-choice]');if(!b)return;box.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});root.querySelectorAll('.show-reveal').forEach(b=>b.onclick=()=>b.nextElementSibling.classList.add('show'))}
function renderQuiz(){const l=languageLesson(),q=l.quiz[qIndex],key=`${selected}|${current.id}`;root.innerHTML=`<section class="quiz"><div class="progress"><span style="width:${(qIndex+1)*100/l.quiz.length}%"></span></div><h2>${qIndex+1}. ${esc(q.question)}</h2><div class="scenario">${esc(q.scenario)}</div>${q.options.map((o,i)=>`<button class="option" data-o="${i}">${esc(o)}</button>`).join('')}<div class="feedback"><b></b><p></p></div><div class="actions"><button id="prev" class="secondary">← ${UI[lang].back}</button><button id="next" class="primary">${qIndex===l.quiz.length-1?UI[lang].finish:UI[lang].next} →</button></div></section>`;root.querySelectorAll('.option').forEach(b=>b.onclick=()=>{const pick=+b.dataset.o,ok=pick===q.answerIndex;root.querySelectorAll('.option').forEach((x,i)=>{x.classList.remove('correct','wrong');if(i===q.answerIndex)x.classList.add('correct')});if(!ok)b.classList.add('wrong');const f=root.querySelector('.feedback');f.classList.add('show');f.querySelector('b').textContent=ok?UI[lang].correct:UI[lang].wrong;f.querySelector('p').textContent=q.explanation});root.querySelector('#prev').onclick=()=>{if(qIndex){qIndex--;renderQuiz()}else{view='lesson';renderLesson()}};root.querySelector('#next').onclick=()=>{if(qIndex<l.quiz.length-1){qIndex++;renderQuiz()}else{const p=load('aiProgress',{});p[key]={...(p[key]||{}),quiz:true};save('aiProgress',p);view='home';renderHome()}}}
function render(){if(view==='lesson'&&current)renderLesson();else if(view==='quiz'&&current)renderQuiz();else renderHome()}setLang();initial();
</script></body></html>
