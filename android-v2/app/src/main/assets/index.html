<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Akshad's Learning Cave</title>
<style>
:root{--bg:#17120f;--surface:#241914;--surface2:#302017;--paper:#f3e5c5;--ink:#24180f;--gold:#f5a63b;--muted:#b9a38e;--line:#ffffff1d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none}
button,input{font:inherit;touch-action:manipulation}
button{cursor:pointer}
#app{min-height:100vh;background:radial-gradient(circle at 80% 0,#5b351f55,transparent 38%),linear-gradient(#211711,#17120f 55%)}
.appbar{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px 16px;background:#17120f;border-bottom:1px solid var(--line)}
.back{width:46px;height:46px;border-radius:50%;border:1px solid #ffffff26;background:#2a1e18;color:#fff;font-size:27px}
.brand{font-family:Georgia,serif;font-size:21px;line-height:1.05}.subtitle{font-size:12px;color:var(--muted);margin-top:4px}
.lang{display:flex;border:1px solid #ffffff25;background:#2a1d17;border-radius:999px;padding:3px;gap:2px}.lang button{border:0;border-radius:999px;padding:9px 10px;background:transparent;color:#d8c4ac;font-size:12px;font-weight:800}.lang button.active{background:var(--gold);color:#21150d}
main{max-width:760px;margin:auto;padding:18px 16px 88px}.hero{padding:28px;border-radius:28px;background:linear-gradient(135deg,#40281b,#241710 66%,#602c12);border:1px solid #ffffff20}.hero h1{font-family:Georgia,serif;font-size:42px;line-height:1.03;margin:0 0 22px}.hero p{font-size:17px;line-height:1.45;margin:0 0 20px}.date{border:1px solid #ffffff2a;background:#2b1d17;color:#fff;border-radius:999px;padding:13px 16px}
.levels{display:flex;gap:10px;margin:20px 0;overflow:auto}.levels button{border:1px solid #ffffff22;background:#2a1d17;color:#fff;border-radius:999px;padding:13px 18px;white-space:nowrap}.levels button.active{background:var(--gold);color:#21150d;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.topic{min-height:214px;border:1px solid #ffffff17;border-radius:26px;background:linear-gradient(145deg,#2a1d17,#1a110e);color:#fff;text-align:left;padding:20px;display:flex;flex-direction:column;align-items:flex-start;position:relative}.topic:active{transform:scale(.985)}.orb{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:34px;background:linear-gradient(145deg,#ffffff19,#0005);box-shadow:inset 0 0 26px var(--tone);margin-bottom:14px}.topic h3{font-family:Georgia,serif;font-size:21px;line-height:1.1;margin:0 0 8px}.topic p{color:var(--muted);font-size:13px;line-height:1.35;margin:0}.status{display:flex;gap:6px;margin-top:auto;padding-top:14px}.chip{font-size:10px;border:1px solid #ffffff20;border-radius:999px;padding:6px 8px;color:#d7c3ad}.chip.done{color:#ffd27f;border-color:#f5a63b66;background:#f5a63b12}
.paper{background:var(--paper);color:var(--ink);border:4px solid #21170f;box-shadow:8px 9px 0 #070504;border-radius:28px;padding:24px;margin:20px 0}.paper h1,.paper h2{font-family:Georgia,serif}.paper h1{font-size:37px}.paper p{font-family:Georgia,serif;font-size:19px;line-height:1.72;overflow-wrap:anywhere}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a4442c;font-weight:900}.meta{font-family:system-ui!important;font-size:14px!important;color:#6b5540}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button,.quiz button{border:0;border-radius:15px;padding:14px 16px;font-weight:900}.primary{background:var(--gold);color:#24160d}.secondary{background:#2b1d17;color:#fff}
.comic{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:center;margin:14px 0 20px}.figure{width:82px;height:94px}.speech{background:#fffaf0;border:3px solid #24180f;border-radius:20px;padding:14px;font-family:system-ui;font-weight:750;line-height:1.35}.figure svg{width:100%;height:100%}
.loading{text-align:center;padding:90px 20px}.loading .bat{font-size:56px;animation:float 1s ease-in-out infinite alternate}@keyframes float{to{transform:translateY(-9px)}}
.quiz{background:var(--paper);color:var(--ink);border:4px solid #21170f;box-shadow:8px 9px 0 #070504;border-radius:28px;padding:22px}.progress{height:8px;background:#d1bf99;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:#5f8e4d}.option{display:block;width:100%;text-align:left;margin:10px 0;background:#fffaf0!important;color:#21170f;border:2px solid #4b3828!important;border-radius:16px;padding:15px!important}.option.correct{background:#d9edbf!important}.option.wrong{background:#f1c8bc!important}.feedback{display:none;background:#dfd1ae;border-left:6px solid #5f8e4d;padding:14px;margin-top:14px}.feedback.show{display:block}.navrow{display:flex;gap:10px;margin-top:16px}.navrow button{flex:1}
@media(max-width:430px){.appbar{grid-template-columns:44px minmax(0,1fr) auto;padding:12px 10px;gap:8px}.brand{font-size:17px}.subtitle{font-size:10px}.lang button{padding:8px 8px;font-size:11px}.hero h1{font-size:38px}.grid{gap:10px}.topic{min-height:196px;padding:15px}.topic h3{font-size:18px}.orb{width:56px;height:56px}.paper{padding:18px}.paper p{font-size:17px}.comic{grid-template-columns:72px minmax(0,1fr)}.figure{width:70px;height:82px}}
</style>
</head>
<body>
<div id="app"><header class="appbar"><button class="back" id="back">‹</button><div><div class="brand">Akshad's Learning Cave</div><div class="subtitle" id="subtitle">Daily independent chambers</div></div><div class="lang"><button data-lang="en">EN</button><button data-lang="mr">मराठी</button></div></header><main id="root"></main></div>
<script>
const TOPICS=[
['psychology','🧠','Psychology','मानसशास्त्र',[['Spotlight Effect',['Spotlight effect','Illusion of transparency','Egocentric bias','Self-consciousness']],['Memory Reconsolidation',['Memory consolidation','Reconsolidation','False memory','Hippocampus']]]],
['sociology','🏙️','Sociology','समाजशास्त्र',[['Strength of Weak Ties',['The Strength of Weak Ties','Social network','Social capital','Homophily']],['Moral Panic',['Moral panic','Folk devil','Mass media','Deviance amplification spiral']]]],
['game','♟️','Game Theory','खेळ सिद्धांत',[['Schelling Points',['Focal point (game theory)','Coordination game','Nash equilibrium','Common knowledge']],['Prisoner’s Dilemma',['Prisoner’s dilemma','Tit for tat','Repeated game','Cooperation']]]],
['history','🗿','History Mysteries','इतिहासातील रहस्ये',[['Bronze Age Collapse',['Late Bronze Age collapse','Sea Peoples','Hittites','Ugarit']],['Voynich Manuscript',['Voynich manuscript','Cryptography','Medieval manuscript','Constructed language']]]],
['politics','👑','Human Political Nature','मानवी राजकीय स्वभाव',[['Iron Law of Oligarchy',['Iron law of oligarchy','Elite theory','Bureaucracy','Political organization']],['Preference Falsification',['Preference falsification','Pluralistic ignorance','Spiral of silence','Revolution']]]],
['glitches','🌀','Mind Glitches','मनातील भ्रम',[['Change Blindness',['Change blindness','Inattentional blindness','Visual perception','Attention']],['Cryptomnesia',['Cryptomnesia','Source-monitoring error','Implicit memory','Déjà vu']]]],
['psychoanalysis','🛋️','Psychoanalysis','मनोविश्लेषण',[['The Uncanny',['Uncanny','Sigmund Freud','Uncanny valley','Doppelgänger']],['Defense Mechanisms',['Defence mechanism','Repression (psychoanalysis)','Projection (psychology)','Sublimation (psychology)']]]],
['medieval','🏰','Medieval Art','मध्ययुगीन कला',[['Marginalia Monsters',['Marginalia','Drolleries','Illuminated manuscript','Bestiary']],['Bayeux Tapestry',['Bayeux Tapestry','Norman Conquest','Romanesque art','Embroidery']]]],
['literature','📚','Literature & the World','साहित्य आणि जग',[['Don Quixote and Modern Fiction',['Don Quixote','Metafiction','Picaresque novel','Modernism']],['The Epic of Gilgamesh',['Epic of Gilgamesh','Hero’s journey','Mesopotamian mythology','Epic poetry']]]],
['art','🎨','Art & the World','कला आणि जग',[['Japanese Woodblock Prints',['Ukiyo-e','Woodblock printing in Japan','Japonisme','The Great Wave off Kanagawa']],['Dada',['Dada','Marcel Duchamp','Readymades of Marcel Duchamp','Anti-art']]]],
['philosophy','🏛️','Philosophy','तत्त्वज्ञान',[['Ship of Theseus',['Ship of Theseus','Identity (philosophy)','Mereology','Personal identity']],['Veil of Ignorance',['Original position','Veil of ignorance','John Rawls','Social contract']]]],
['statistics','📊','Statistics','सांख्यिकी',[['Simpson’s Paradox',["Simpson's paradox",'Confounding','Causal inference','Contingency table']],['Survivorship Bias',['Survivorship bias','Abraham Wald','Selection bias','Missing data']]]],
['mythology','🐉','World Mythology','जागतिक पुराणकथा',[['World Flood Myths',['Flood myth','Manu (Hinduism)','Utnapishtim','Deucalion']],['Trickster Gods',['Trickster','Loki','Anansi','Coyote (mythology)']]]]
];
const UI={en:{sub:'Daily independent chambers',choose:'Choose a chamber.',desc:'Each subject is independent. Pick a date and level, then open a focused long-form lesson.',level:'Level',unread:'Unread',read:'Read',quiz:'Quiz',mark:'Mark as read',take:'Take quiz',opening:'Opening the chamber…',internet:'This chamber needs internet once.',about:'about',mins:'minutes',panel:'Panel',finish:'Finish quiz',next:'Next',back:'Back',correct:'Correct',wrong:'Not quite',translate:'Preparing Marathi translation…'},mr:{sub:'दररोजच्या स्वतंत्र ज्ञानगुहा',choose:'एक ज्ञानगुहा निवडा.',desc:'प्रत्येक विषय स्वतंत्र आहे. तारीख आणि पातळी निवडा, मग सखोल धडा उघडा.',level:'पातळी',unread:'न वाचलेले',read:'वाचले',quiz:'प्रश्नमंजुषा',mark:'वाचले म्हणून नोंदवा',take:'प्रश्नमंजुषा सोडवा',opening:'ज्ञानगुहा उघडत आहे…',internet:'हा धडा प्रथमच उघडण्यासाठी इंटरनेट आवश्यक आहे.',about:'सुमारे',mins:'मिनिटे',panel:'भाग',finish:'प्रश्नमंजुषा पूर्ण करा',next:'पुढे',back:'मागे',correct:'बरोबर',wrong:'पुन्हा विचार करा',translate:'मराठी भाषांतर तयार होत आहे…'}};
const root=document.getElementById('root'),subtitle=document.getElementById('subtitle');
let lang=localStorage.caveLang==='mr'?'mr':'en',date=localStorage.caveDate||new Date().toISOString().slice(0,10),level=+(localStorage.caveLevel||1),stack=[],current=null;
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const load=(k,d={})=>{try{return JSON.parse(localStorage[k]||JSON.stringify(d))}catch(e){return d}},save=(k,v)=>{try{localStorage[k]=JSON.stringify(v)}catch(e){}};
const key=t=>`${date}|${t[0]}|${level}`;const choice=t=>t[4][hash(t[0]+date+level)%t[4].length];
function setLangButtons(){document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));subtitle.textContent=UI[lang].sub}
document.querySelector('.lang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.lang;localStorage.caveLang=lang;setLangButtons();current?openTopic(current,true):home()});
document.getElementById('back').addEventListener('click',()=>window.caveBack());
function push(view){stack.push(view);history.pushState({cave:true},'');}
window.caveBack=()=>{if(stack.length){history.back();return true}return false};
window.addEventListener('popstate',()=>{if(stack.length)stack.pop();home()});
function home(){current=null;setLangButtons();const p=load('progress',{}),tones=['#c95e65','#4f8e9d','#7b78c7','#a56a3f','#d5a52d','#5387c6','#61738e','#8e694b','#a97096','#b96e48','#768d55','#5d997f','#8d62a0'];root.innerHTML=`<section class="hero"><h1>${UI[lang].choose}</h1><p>${UI[lang].desc}</p><input class="date" id="date" type="date" value="${date}"></section><div class="levels">${[1,2,3].map(n=>`<button data-level="${n}" class="${n===level?'active':''}">${UI[lang].level} ${n}</button>`).join('')}</div><section class="grid">${TOPICS.map((t,i)=>{const st=p[key(t)]||{},q=choice(t);return `<button class="topic" data-topic="${t[0]}" style="--tone:${tones[i]}55"><span class="orb">${t[1]}</span><h3>${lang==='mr'?t[3]:t[2]}</h3><p>${esc(q[0])}</p><span class="status"><span class="chip ${st.read?'done':''}">${st.read?'✓':'○'} ${st.read?UI[lang].read:UI[lang].unread}</span><span class="chip ${st.quiz?'done':''}">${st.quiz?'✓':'○'} ${UI[lang].quiz}</span></span></button>`}).join('')}</section>`;root.querySelector('#date').addEventListener('change',e=>{date=e.target.value;localStorage.caveDate=date;home()});root.querySelector('.levels').addEventListener('click',e=>{const b=e.target.closest('[data-level]');if(!b)return;level=+b.dataset.level;localStorage.caveLevel=level;home()});root.querySelector('.grid').addEventListener('click',e=>{const b=e.target.closest('[data-topic]');if(!b)return;const t=TOPICS.find(x=>x[0]===b.dataset.topic);push('topic');openTopic(t,false)});}
async function wiki(title,code='en'){const u=`https://${code}.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&redirects=1&format=json&origin=*&titles=${encodeURIComponent(title)}`;const r=await fetch(u);if(!r.ok)throw 0;const j=await r.json(),x=Object.values(j.query.pages)[0];return{title:x.title,text:x.extract||''}}
const cut=(s,n)=>s.split(/\s+/).slice(0,n).join(' ');
async function translate(text){const cache=load('mrCache',{}),k=text;if(cache[k])return cache[k];const u='https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=mr&dt=t&q='+encodeURIComponent(text);const r=await fetch(u);if(!r.ok)throw 0;const j=await r.json(),v=(j[0]||[]).map(x=>x[0]).join('');cache[k]=v||text;save('mrCache',cache);return v||text}
async function buildLesson(t){const q=choice(t),pages=[];for(const title of q[1]){try{const x=await wiki(title);if(x.text.length>500)pages.push(x)}catch(e){}}if(!pages.length)throw 0;const lim=level===1?650:level===2?800:950;return{title:q[0],panels:pages.map((x,i)=>({title:x.title,label:['Entrance','Mechanism','Human story','Wider pattern'][i]||'Deeper chamber',text:cut(x.text,lim)})),total:pages.reduce((a,x)=>a+Math.min(lim,x.text.split(/\s+/).length),0)}}
function character(i){const colors=['#4f8e9d','#a56a3f','#8e694b','#768d55'];return `<svg viewBox="0 0 90 105"><ellipse cx="45" cy="99" rx="27" ry="6" fill="#000" opacity=".18"/><path d="M23 95q3-31 22-31t22 31" fill="${colors[i%colors.length]}" stroke="#24180f" stroke-width="3"/><circle cx="45" cy="43" r="25" fill="#efc596" stroke="#24180f" stroke-width="3"/><circle cx="37" cy="42" r="3"/><circle cx="53" cy="42" r="3"/><path d="M37 54q8 7 16 0" fill="none" stroke="#24180f" stroke-width="3" stroke-linecap="round"/></svg>`}
async function openTopic(t,rerender){current=t;subtitle.textContent=(lang==='mr'?t[3]:t[2])+' · '+UI[lang].level+' '+level;root.innerHTML=`<div class="loading"><div class="bat">🦇</div><h2>${lang==='mr'?UI.mr.translate:UI.en.opening}</h2></div>`;const lessons=load('lessons',{}),ck=key(t);let lesson=lessons[ck];try{if(!lesson){lesson=await buildLesson(t);lessons[ck]=lesson;save('lessons',lessons)}}catch(e){root.innerHTML=`<div class="loading"><h2>${UI[lang].internet}</h2></div>`;return}let shown=lesson;if(lang==='mr'){try{const panels=[];for(const p of lesson.panels)panels.push({title:await translate(p.title),label:await translate(p.label),text:await translate(p.text)});shown={...lesson,title:await translate(lesson.title),panels}}catch(e){}}renderLesson(t,shown,lesson,ck)}
function renderLesson(t,shown,base,ck){const p=load('progress',{}),st=p[ck]||{};root.innerHTML=`<section class="paper"><div class="eyebrow">${lang==='mr'?'चित्रमय ज्ञानसंच':'Illustrated knowledge dossier'}</div><h1>${esc(shown.title)}</h1><p class="meta">${t[1]} ${lang==='mr'?t[3]:t[2]} · ${UI[lang].level} ${level} · ${UI[lang].about} ${Math.max(15,Math.round(base.total/190))} ${UI[lang].mins}</p><div class="actions"><button class="primary" id="read">${st.read?'✓ '+UI[lang].read:UI[lang].mark}</button><button class="secondary" id="quiz">${UI[lang].take}</button></div></section>${shown.panels.map((p,i)=>`<article class="paper"><div class="eyebrow">${UI[lang].panel} ${i+1} · ${esc(p.label)}</div><h2>${esc(p.title)}</h2><div class="comic"><div class="figure">${character(i)}</div><div class="speech">${lang==='mr'?'इथे मुख्य कल्पना शोधा; तपशीलात हरवू नका.':'Look for the mechanism here, not just the facts.'}</div></div><p>${esc(p.text)}</p></article>`).join('')}`;root.querySelector('#read').addEventListener('click',()=>{const pr=load('progress',{});pr[ck]={...(pr[ck]||{}),read:true};save('progress',pr);root.querySelector('#read').textContent='✓ '+UI[lang].read});root.querySelector('#quiz').addEventListener('click',()=>{push('quiz');showQuiz(base,ck)})}
function questions(lesson){return lesson.panels.slice(0,6).map((p,i)=>{const others=lesson.panels.filter((_,j)=>j!==i).map(x=>x.title);const scenario=(p.text.split(/(?<=[.!?])\s+/)[1]||p.text.split(/(?<=[.!?])\s+/)[0]||p.text).slice(0,260);const opts=[p.title,...others].slice(0,4);while(opts.length<4)opts.push(['A legal convention','A random coincidence','A biological reflex','A measurement error'][opts.length]);const r=hash(p.title)%opts.length;return{q:lang==='mr'?'या परिस्थितीचे सर्वोत्तम स्पष्टीकरण कोणती संकल्पना देते?':'Which concept best explains this situation?',scenario,answer:p.title,options:opts.slice(r).concat(opts.slice(0,r)),why:(p.text.split(/(?<=[.!?])\s+/)[0]||p.text).slice(0,280)}})}
function showQuiz(lesson,ck){const qs=questions(lesson);let i=0;subtitle.textContent=UI[lang].quiz+' · '+lesson.title;const render=()=>{const q=qs[i];root.innerHTML=`<section class="quiz"><div class="progress"><span style="width:${(i+1)*100/qs.length}%"></span></div><h2>${i+1}. ${esc(q.q)}</h2><p>${esc(q.scenario)}</p>${q.options.map((o,j)=>`<button class="option" data-answer="${j}">${esc(o)}</button>`).join('')}<div class="feedback" id="feedback"><b></b><p></p></div><div class="navrow"><button class="secondary" id="prev">← ${UI[lang].back}</button><button class="primary" id="next">${i===qs.length-1?UI[lang].finish:UI[lang].next} →</button></div></section>`;root.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>{const picked=q.options[+b.dataset.answer],ok=picked===q.answer;root.querySelectorAll('.option').forEach(x=>{x.classList.remove('correct','wrong');if(q.options[+x.dataset.answer]===q.answer)x.classList.add('correct')});if(!ok)b.classList.add('wrong');const f=root.querySelector('#feedback');f.classList.add('show');f.querySelector('b').textContent=ok?UI[lang].correct:UI[lang].wrong;f.querySelector('p').textContent=q.why}));root.querySelector('#prev').addEventListener('click',()=>{if(i>0){i--;render()}else window.caveBack()});root.querySelector('#next').addEventListener('click',()=>{if(i<qs.length-1){i++;render()}else{const p=load('progress',{});p[ck]={...(p[ck]||{}),quiz:true};save('progress',p);stack=[];home()}})};render()}
history.replaceState({home:true},'');setLangButtons();home();
</script>
</body></html>
