<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Akshad's Learning Cave</title><style>:root{--bg:#17120f;--card:#f3e4c4;--ink:#21170f;--gold:#f3a43b;--muted:#bba58c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#4b3020,#17120f 52%);color:#fff;font-family:system-ui,sans-serif;min-height:100vh}header{position:sticky;top:0;z-index:8;padding:18px 16px 12px;background:#17120ff2;border-bottom:1px solid #ffffff18;display:flex;gap:12px;align-items:center}header button{width:44px;height:44px;border-radius:50%;border:1px solid #ffffff2a;background:#2b1f18;color:white;font-size:24px}.brand{font-family:Georgia,serif;font-size:20px}.crumb{font-size:12px;color:var(--muted)}main{padding:16px 16px 90px;max-width:760px;margin:auto}.hero,.topic,.panel,.quiz{border-radius:24px}.hero{padding:22px;background:linear-gradient(135deg,#3b271b,#211711);border:1px solid #ffffff20;margin-bottom:14px}.hero h1,.panel h2{font-family:Georgia,serif}.row{display:flex;gap:9px;overflow:auto;margin:10px 0 15px}.row button,input{border:1px solid #ffffff20;background:#2b1d17;color:#fff;border-radius:999px;padding:11px 14px;white-space:nowrap}.row button.active{background:var(--gold);color:#24160d;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.topic{position:relative;min-height:148px;padding:15px;text-align:left;background:#251a15;color:white;border:1px solid #ffffff18}.topic b{display:block;font-family:Georgia,serif;font-size:17px;margin:7px 0}.topic small{color:var(--muted)}.mark{position:absolute;bottom:10px;right:10px;font-size:11px;color:#f0cb8b}.panel,.quiz{background:var(--card);color:var(--ink);border:4px solid #21170f;box-shadow:7px 8px 0 #070504;padding:18px;margin:18px 0}.panel p{font-family:Georgia,serif;font-size:18px;line-height:1.7}.panel .k{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#a63f28;font-weight:900}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions button,.quiz button{border:0;border-radius:14px;padding:13px 15px;font-weight:800}.primary{background:var(--gold);color:#22150d}.secondary{background:#2c1e18;color:#fff}.option{display:block;width:100%;text-align:left;margin:9px 0;background:#fffaf0!important;color:#21170f;border:2px solid #4b3828!important}.option.chosen{background:#f8c978!important}.explain{display:none;background:#ddcfb0;border-left:5px solid #526b4d;padding:12px}.loading{text-align:center;padding:70px 10px}.bat{font-size:54px;animation:b 1s infinite alternate}@keyframes b{to{transform:translateY(-10px)}}@media(max-width:390px){.topic{min-height:140px;padding:12px}.topic b{font-size:15px}}</style></head><body><header><button id="back">‹</button><div><div class="brand">Akshad's Learning Cave</div><div class="crumb" id="crumb">Daily chambers</div></div></header><main id="root"></main><script>const T=[['psychology','🧠','Psychology',[['Spotlight Effect',['Spotlight effect','Illusion of transparency','Egocentric bias','Self-consciousness']],['Memory Reconsolidation',['Memory consolidation','Reconsolidation','False memory','Hippocampus']]]],['sociology','🏙️','Sociology',[['Strength of Weak Ties',['The Strength of Weak Ties','Social network','Social capital','Homophily']],['Moral Panic',['Moral panic','Folk devil','Mass media','Deviance amplification spiral']]]],['game','♟️','Game Theory',[['Schelling Points',['Focal point (game theory)','Coordination game','Nash equilibrium','Common knowledge']],['Prisoner’s Dilemma',['Prisoner’s dilemma','Tit for tat','Repeated game','Cooperation']]]],['history','🗿','History Mysteries',[['Bronze Age Collapse',['Late Bronze Age collapse','Sea Peoples','Hittites','Ugarit']],['Voynich Manuscript',['Voynich manuscript','Cryptography','Medieval manuscript','Constructed language']]]],['politics','👑','Human Political Nature',[['Iron Law of Oligarchy',['Iron law of oligarchy','Elite theory','Bureaucracy','Political organization']],['Preference Falsification',['Preference falsification','Pluralistic ignorance','Spiral of silence','Revolution']]]],['glitches','🌀','Mind Glitches',[['Change Blindness',['Change blindness','Inattentional blindness','Visual perception','Attention']],['Cryptomnesia',['Cryptomnesia','Source-monitoring error','Implicit memory','Déjà vu']]]],['psychoanalysis','🛋️','Psychoanalysis',[['The Uncanny',['Uncanny','Sigmund Freud','Uncanny valley','Doppelgänger']],['Defense Mechanisms',['Defence mechanism','Repression (psychoanalysis)','Projection (psychology)','Sublimation (psychology)']]]],['medieval','🏰','Medieval Art',[['Marginalia Monsters',['Marginalia','Drolleries','Illuminated manuscript','Bestiary']],['Bayeux Tapestry',['Bayeux Tapestry','Norman Conquest','Romanesque art','Embroidery']]]],['literature','📚','Literature & the World',[['Don Quixote and Modern Fiction',['Don Quixote','Metafiction','Picaresque novel','Modernism']],['The Epic of Gilgamesh',['Epic of Gilgamesh','Hero’s journey','Mesopotamian mythology','Epic poetry']]]],['art','🎨','Art & the World',[['Japanese Woodblock Prints',['Ukiyo-e','Woodblock printing in Japan','Japonisme','The Great Wave off Kanagawa']],['Dada',['Dada','Marcel Duchamp','Readymades of Marcel Duchamp','Anti-art']]]],['philosophy','🏛️','Philosophy',[['Ship of Theseus',['Ship of Theseus','Identity (philosophy)','Mereology','Personal identity']],['Veil of Ignorance',['Original position','Veil of ignorance','John Rawls','Social contract']]]],['statistics','📊','Statistics',[['Simpson’s Paradox',["Simpson's paradox",'Confounding','Causal inference','Contingency table']],['Survivorship Bias',['Survivorship bias','Abraham Wald','Selection bias','Missing data']]]],['mythology','🐉','World Mythology',[['World Flood Myths',['Flood myth','Manu (Hinduism)','Utnapishtim','Deucalion']],['Trickster Gods',['Trickster','Loki','Anansi','Coyote (mythology)']]]]];const R=document.getElementById('root'),C=document.getElementById('crumb');let S=[],D=localStorage.date||new Date().toISOString().slice(0,10),L=1;const H=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0},E=s=>(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x])),K=(t)=>`${D}|${t}|${L}`,P=()=>JSON.parse(localStorage.progress||'{}'),SP=p=>localStorage.progress=JSON.stringify(p),CA=()=>JSON.parse(localStorage.lessons||'{}'),SC=c=>{try{localStorage.lessons=JSON.stringify(c)}catch(e){}};function choice(t){return t[3][H(t[0]+D+L)%t[3].length]}function nav(fn){S.push(true);history.pushState({cave:1},'',location.href);fn()}function home(){S=[];C.textContent='Daily independent chambers';let p=P();R.innerHTML=`<section class="hero"><h1>Choose a chamber.</h1><p>Each subject is independent. Pick a date and level, then read a long connected lesson assembled from several public knowledge pages.</p><div class="row"><input id="date" type="date" value="${D}"></div></section><div class="row">${[1,2,3].map(x=>`<button data-l="${x}" class="${x===L?'active':''}">Level ${x}</button>`).join('')}</div><div class="grid">${T.map(t=>{let s=p[K(t[0])]||{},q=choice(t);return `<button class="topic" data-t="${t[0]}"><span style="font-size:34px">${t[1]}</span><b>${t[2]}</b><small>${E(q[0])}</small><span class="mark">${s.read?'✓ Read':'○ Unread'} · ${s.quiz?'✓ Quiz':'○ Quiz'}</span></button>`}).join('')}</div>`;document.getElementById('date').onchange=e=>{D=e.target.value;localStorage.date=D;home()};document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{L=+b.dataset.l;home()});document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>open(T.find(t=>t[0]===b.dataset.t)))}async function get(title,lang='en'){let u=`https://${lang}.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&redirects=1&format=json&origin=*&titles=${encodeURIComponent(title)}`,r=await fetch(u),j=await r.json(),x=Object.values(j.query.pages)[0];return{x:x.extract||'',title:x.title}}function cut(s,n){return s.split(/\s+/).slice(0,n).join(' ')}async function assemble(t,lang='en'){let q=choice(t),pages=[];for(let title of q[1]){try{let x=await get(title,lang);if(x.x.length>500)pages.push(x)}catch(e){}}if(!pages.length)throw 0;let lim=L===1?650:L===2?800:950,panels=pages.map((x,i)=>({title:x.title,k:['Entrance','Mechanism','Human story','Wider pattern'][i],text:cut(x.x,lim)}));return{title:q[0],panels,total:panels.reduce((a,x)=>a+x.text.split(/\s+/).length,0)}}function open(t){nav(async()=>{C.textContent=`${t[2]} · Level ${L}`;R.innerHTML='<div class="loading"><div class="bat">🦇</div><h2>Opening the chamber…</h2></div>';let ck=K(t[0]),c=CA(),lesson=c[ck];try{if(!lesson){lesson=await assemble(t);c[ck]=lesson;SC(c)}}catch(e){R.innerHTML='<div class="loading"><h2>This chamber needs internet once.</h2><p>After opening, it stays cached on your phone.</p></div>';return}render(t,lesson,ck)})}function render(t,l,ck){R.innerHTML=`<section class="panel"><div class="k">Comic dossier</div><h2>${E(l.title)}</h2><p>${t[1]} ${t[2]} · Level ${L} · about ${Math.max(15,Math.round(l.total/190))} min</p><div class="actions"><button class="primary" id="read">${(P()[ck]||{}).read?'✓ Read':'Mark as read'}</button><button class="secondary" id="quiz">Take quiz</button></div></section>${l.panels.map((p,i)=>`<article class="panel"><div class="k">Panel ${i+1} · ${p.k}</div><h2>${E(p.title)}</h2><p>${E(p.text)}</p></article>`).join('')}`;document.getElementById('read').onclick=()=>{let p=P();p[ck]={...(p[ck]||{}),read:true};SP(p);document.getElementById('read').textContent='✓ Read'};document.getElementById('quiz').onclick=()=>quiz(l,ck)}function quiz(l,ck){nav(()=>{C.textContent='Quiz · '+l.title;let saved=(P()[ck]||{}).answers||{},qs=l.panels.map((p,i)=>({q:`Which idea belongs to “${p.title}”?`,a:p.text.split(/(?<=[.!?])\s+/)[0],o:[p.text.split(/(?<=[.!?])\s+/)[0],...l.panels.filter((_,j)=>j!==i).map(x=>x.text.split(/(?<=[.!?])\s+/)[0])].slice(0,4)}));R.innerHTML=qs.map((q,i)=>`<div class="quiz"><h3>${i+1}. ${E(q.q)}</h3>${q.o.map((o,j)=>`<button class="option ${saved[i]===j?'chosen':''}" data-q="${i}" data-o="${j}">${E(o)}</button>`).join('')}<div class="explain" id="e${i}">Key idea: ${E(q.a)}</div></div>`).join('')+'<button class="primary" id="done">Mark quiz completed</button>';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{let i=+b.dataset.q,j=+b.dataset.o;document.querySelectorAll(`[data-q="${i}"]`).forEach(x=>x.classList.remove('chosen'));b.classList.add('chosen');document.getElementById('e'+i).style.display='block';let p=P();p[ck]={...(p[ck]||{}),answers:{...((p[ck]||{}).answers||{}),[i]:j}};SP(p)});document.getElementById('done').onclick=()=>{let p=P();p[ck]={...(p[ck]||{}),quiz:true};SP(p);alert('Quiz remembered.')}})}window.addEventListener('popstate',()=>{if(S.length){S.pop();home()}});window.caveBack=()=>{if(S.length){history.back();return true}return false};document.getElementById('back').onclick=window.caveBack;history.replaceState({home:1},'',location.href);home();</script></body></html>
