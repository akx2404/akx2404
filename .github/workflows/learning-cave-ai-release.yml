name: Learning Cave AI Release

on:
  push:
    branches: [master]
    paths: ['.github/workflows/learning-cave-ai-release.yml']
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: write

concurrency:
  group: learning-cave-ai-release
  cancel-in-progress: false

jobs:
  generate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TEXT_MODEL: gpt-5-mini
      IMAGE_MODEL: gpt-image-1-mini
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-learning-cave-v2-direct
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify API secret
        run: test -n "$OPENAI_API_KEY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate daily pack
        run: python ai/generate_daily.py
      - name: Validate daily pack
        run: |
          python - <<'PY'
          import json,pathlib
          latest=json.loads(pathlib.Path('daily/latest.json').read_text())['date']
          p=pathlib.Path('daily')/latest/'manifest.json'
          d=json.loads(p.read_text())
          assert len(d['lessons'])==10
          assert len({x['title'].casefold() for x in d['lessons']})==10
          for x in d['lessons']:
            assert len(x['english']['sections'])>=7
            assert len(x['marathi']['sections'])>=7
            assert len(x['english']['quiz'])>=6
            assert len(x['images'])==2
            for im in x['images']: assert (p.parent/im['file']).stat().st_size>10000
          print('validated',latest)
          PY
      - name: Publish pack
        run: |
          git config user.name "Learning Cave Daily Bot"
          git config user.email "actions@users.noreply.github.com"
          git add daily ai/used_topics.json
          git diff --cached --quiet || git commit -m "Publish AI daily pack [skip ci]"
          git push origin HEAD:build-learning-cave-v2-direct
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Enable AI reader and build
        run: |
          cp android-v2/app/src/main/assets/ai_reader.html android-v2/app/src/main/assets/index.html
          cd android-v2
          gradle :app:assembleDebug --stacktrace
      - name: Validate APK
        run: |
          APK=android-v2/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          unzip -p "$APK" assets/index.html >/tmp/index.html
          grep -q "Ten new journeys every day" /tmp/index.html
          grep -q "aiDailyCache" /tmp/index.html
          cp "$APK" Akshads-Learning-Cave-AI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: akshads-learning-cave-ai-apk
          path: Akshads-Learning-Cave-AI.apk
          retention-days: 3
