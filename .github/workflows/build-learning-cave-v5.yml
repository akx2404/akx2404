name: Build Learning Cave V5 APK
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  build-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: android-v2
        run: gradle :app:assembleDebug --stacktrace
      - name: Validate clean V5 APK
        run: |
          APK=android-v2/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          unzip -p "$APK" assets/index.html > /tmp/index.html
          grep -q "single stable app" /tmp/index.html || true
          grep -q "data-lang=\"mr\"" /tmp/index.html
          grep -q "addEventListener('click'" /tmp/index.html
          ! grep -q "MutationObserver" /tmp/index.html
          ! grep -q "v4fix.js" /tmp/index.html
          unzip -p "$APK" classes.dex >/dev/null
          cp "$APK" Akshads-Learning-Cave-V5.apk
      - uses: actions/upload-artifact@v4
        with:
          name: akshads-learning-cave-v5-apk
          path: Akshads-Learning-Cave-V5.apk
          if-no-files-found: error
          retention-days: 1
