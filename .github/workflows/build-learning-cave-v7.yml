name: Build Learning Cave V7 APK
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  build-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Enable V7 engine
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('android-v2/app/src/main/assets/index.html')
          s=p.read_text()
          s=s.replace('</body>','<script src="redesign.js"></script><script src="v7.js"></script></body>')
          p.write_text(s)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: android-v2
        run: gradle :app:assembleDebug --stacktrace
      - name: Validate V7 APK
        run: |
          APK=android-v2/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          unzip -p "$APK" assets/index.html > /tmp/index.html
          grep -q 'redesign.js' /tmp/index.html
          grep -q 'v7.js' /tmp/index.html
          unzip -p "$APK" assets/v7.js > /tmp/v7.js
          grep -q 'const LIB=' /tmp/v7.js
          grep -q 'dayNumber(date)\*3' /tmp/v7.js
          grep -q "Prisoner’s Dilemma" /tmp/v7.js
          grep -q "Dancing Plague of 1518" /tmp/v7.js
          grep -q "Anscombe’s Quartet" /tmp/v7.js
          grep -q 'visualScene' /tmp/v7.js
          cp "$APK" Akshads-Learning-Cave-V7.apk
      - uses: actions/upload-artifact@v4
        with:
          name: akshads-learning-cave-v7-apk
          path: Akshads-Learning-Cave-V7.apk
          if-no-files-found: error
          retention-days: 1
