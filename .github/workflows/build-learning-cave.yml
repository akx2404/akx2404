name: Build Learning Cave APK
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified Android project
        run: |
          cat lite.part00a lite.part00b lite.part01 > learning-cave-lite.b64
          base64 --decode learning-cave-lite.b64 > project.tar.gz
          echo "36573c13b147f019346a62035a5e830966ac103d7c2f57a9e3fad49a4b91b7c7  project.tar.gz" | sha256sum -c -
          tar -xzf project.tar.gz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: learning-cave-lite
        run: gradle :app:assembleDebug --stacktrace
      - name: Name APK
        run: cp learning-cave-lite/app/build/outputs/apk/debug/app-debug.apk Akshads-Learning-Cave.apk
      - uses: actions/upload-artifact@v4
        with:
          name: akshads-learning-cave-apk
          path: Akshads-Learning-Cave.apk
          if-no-files-found: error
          retention-days: 1
