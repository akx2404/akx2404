name: Build Learning Cave APK
on:
  push:
    branches: [build-learning-cave-apk]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android project
        run: |
          base64 --decode learning-cave-android.tar.gz.b64 > project.tar.gz
          tar -xzf project.tar.gz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: learning-cave-android
        run: gradle :app:assembleDebug --stacktrace
      - name: Name APK
        run: cp learning-cave-android/app/build/outputs/apk/debug/app-debug.apk Akshads-Learning-Cave.apk
      - uses: actions/upload-artifact@v4
        with:
          name: akshads-learning-cave-apk
          path: Akshads-Learning-Cave.apk
          if-no-files-found: error
          retention-days: 1
