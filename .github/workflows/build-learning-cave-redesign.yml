name: Build Learning Cave Redesign APK
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  build-redesign:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Enable redesigned journey engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-v2/app/src/main/assets/index.html')
          s=p.read_text()
          assert 'redesign.js' not in s
          s=s.replace('</body>','<script src="redesign.js"></script></body>')
          p.write_text(s)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: android-v2
        run: gradle :app:assembleDebug --stacktrace
      - name: Validate redesigned APK
        run: |
          APK=android-v2/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          unzip -p "$APK" assets/index.html > /tmp/index.html
          unzip -p "$APK" assets/redesign.js > /tmp/redesign.js
          grep -q 'redesign.js' /tmp/index.html
          grep -q 'subject-specific knowledge journey redesign' /tmp/redesign.js || grep -q 'knowledge journey' /tmp/redesign.js
          grep -q 'subject-game' /tmp/redesign.js
          grep -q 'subject-statistics' /tmp/redesign.js
          grep -q 'betterQuestions' /tmp/redesign.js
          ! grep -q 'v6visual.js' /tmp/index.html
          ! grep -q 'MutationObserver' /tmp/redesign.js
          cp "$APK" Akshads-Learning-Cave-Redesign.apk
      - uses: actions/upload-artifact@v4
        with:
          name: akshads-learning-cave-redesign-apk
          path: Akshads-Learning-Cave-Redesign.apk
          if-no-files-found: error
          retention-days: 1
