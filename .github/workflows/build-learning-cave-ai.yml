name: Build Learning Cave Cave Keeper APK

on:
  pull_request:
    branches: [master]
  push:
    branches: [build-learning-cave-v2-direct]
    paths:
      - 'ai/**'
      - 'android-v2/app/src/main/assets/ai_reader.html'
      - 'android-v2/app/src/main/assets/keeper_v9.js'
      - '.github/workflows/build-learning-cave-ai.yml'
  workflow_dispatch:
    inputs:
      lesson_date:
        description: 'Optional YYYY-MM-DD date'
        required: false
        type: string
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: write

concurrency:
  group: learning-cave-keeper-dialogue-v9
  cancel-in-progress: true

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TEXT_MODEL: gpt-5-mini
      LESSON_DATE: ${{ github.event.inputs.lesson_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-learning-cave-v2-direct
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify secret
        run: test -n "$OPENAI_API_KEY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check OpenAI access
        run: python ai/api_probe.py
      - name: Generate ten lessons and Cave Keeper dialogue
        run: python ai/generate_daily_keeper.py
      - name: Validate generated pack
        run: |
          python - <<'PY'
          import json,pathlib
          latest=json.loads(pathlib.Path('daily/latest.json').read_text())['date']
          p=pathlib.Path('daily')/latest/'manifest.json'
          d=json.loads(p.read_text())
          assert d.get('visualMode') == 'cave-keeper-dialogue'
          assert len(d['lessons']) == 10
          assert len({x['title'].strip().casefold() for x in d['lessons']}) == 10
          assert sum(len(x['english']['quiz']) for x in d['lessons']) == 50
          assert sum(len(x['keeper']) for x in d['lessons']) == 350
          for x in d['lessons']:
            assert 14 <= x['readingMinutes'] <= 18
            assert 6 <= len(x['english']['sections']) <= 7
            assert 6 <= len(x['marathi']['sections']) <= 7
            assert len(x['english']['quiz']) == 5 and len(x['marathi']['quiz']) == 5
            assert x['images'] == []
            assert len(x['keeper']) == 35
            assert all(k['english'].strip() and k['marathi'].strip() for k in x['keeper'])
            counts={i:0 for i in range(8)}
            for k in x['keeper']: counts[k['placement']] += 1
            assert min(counts.values()) >= 3, counts
          assert not list(p.parent.glob('*.png'))
          print('Validated no-image Cave Keeper pack', latest)
          PY
      - name: Publish generated pack
        continue-on-error: true
        run: |
          git config user.name "Learning Cave Daily Bot"
          git config user.email "actions@users.noreply.github.com"
          git add daily ai/used_topics.json
          git diff --cached --quiet || git commit -m "Publish Cave Keeper lesson pack [skip ci]"
          git push origin HEAD:build-learning-cave-v2-direct
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Enable reader and Cave Keeper
        run: |
          cp android-v2/app/src/main/assets/ai_reader.html android-v2/app/src/main/assets/index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('android-v2/app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          assert '</body>' in s
          s=s.replace('</body>','<script src="keeper_v9.js"></script></body>')
          p.write_text(s,encoding='utf-8')
          PY
          rm -rf android-v2/app/src/main/assets/daily
          mkdir -p android-v2/app/src/main/assets/daily
          cp -r daily/* android-v2/app/src/main/assets/daily/
      - name: Build APK
        working-directory: android-v2
        run: gradle :app:assembleDebug --stacktrace
      - name: Validate APK
        run: |
          APK=android-v2/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          unzip -p "$APK" assets/index.html > /tmp/index.html
          grep -q "Ten new journeys every day" /tmp/index.html
          grep -q "aiDailyCache" /tmp/index.html
          grep -q "data-lang=\"mr\"" /tmp/index.html
          grep -q 'script src="keeper_v9.js"' /tmp/index.html
          unzip -p "$APK" assets/keeper_v9.js > /tmp/keeper.js
          grep -q "Cave Keeper" /tmp/keeper.js
          grep -q "गुहा रक्षक" /tmp/keeper.js
          unzip -l "$APK" | grep -q 'assets/daily/latest.json'
          if unzip -l "$APK" | grep -q 'assets/daily/.*\.png'; then exit 1; fi
          cp "$APK" Akshads-Learning-Cave-Cave-Keeper-V9.apk
      - uses: actions/upload-artifact@v4
        with:
          name: akshads-learning-cave-cave-keeper-v9-apk
          path: Akshads-Learning-Cave-Cave-Keeper-V9.apk
          retention-days: 3
