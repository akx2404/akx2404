name: Build Learning Cave AI Daily APK

on:
  pull_request:
    branches: [master]
  push:
    branches: [build-learning-cave-v2-direct]
    paths:
      - 'ai/**'
      - 'android-v2/app/src/main/assets/ai_reader.html'
      - 'android-v2/app/src/main/assets/guide.js'
      - '.github/workflows/build-learning-cave-ai.yml'
  workflow_dispatch:
    inputs:
      lesson_date:
        description: 'Optional YYYY-MM-DD date'
        required: false
        type: string
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: write

concurrency:
  group: learning-cave-ai-guide-editorial-v1
  cancel-in-progress: true

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TEXT_MODEL: gpt-5-mini
      IMAGE_MODEL: gpt-image-1-mini
      LESSON_DATE: ${{ github.event.inputs.lesson_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-learning-cave-v2-direct
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify secret
        run: test -n "$OPENAI_API_KEY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check OpenAI billing and model access
        run: python ai/api_probe.py
      - name: Generate ten daily lessons and editorial illustrations
        run: python ai/generate_daily_editorial.py
      - name: Validate generated pack
        run: |
          python - <<'PY'
          import json,pathlib
          latest=json.loads(pathlib.Path('daily/latest.json').read_text())['date']
          p=pathlib.Path('daily')/latest/'manifest.json'
          d=json.loads(p.read_text())
          assert d.get('visualMode') == 'editorial-illustration'
          assert len(d['lessons'])==10
          assert len({x['title'].strip().casefold() for x in d['lessons']})==10
          assert sum(len(x['english']['quiz']) for x in d['lessons'])==50
          for x in d['lessons']:
            assert 14 <= x['readingMinutes'] <= 18
            assert 6 <= len(x['english']['sections']) <= 7
            assert 6 <= len(x['marathi']['sections']) <= 7
            assert len(x['english']['quiz'])==5 and len(x['marathi']['quiz'])==5
            assert len(x['images'])==1
            assert x['images'][0].get('kind') == 'editorial'
            for im in x['images']:
              assert (p.parent/im['file']).stat().st_size>10000
          print('Validated guide + editorial pack', latest)
          PY
      - name: Publish generated pack
        continue-on-error: true
        run: |
          git config user.name "Learning Cave Daily Bot"
          git config user.email "actions@users.noreply.github.com"
          git add daily ai/used_topics.json
          git diff --cached --quiet || git commit -m "Publish guide editorial AI lesson pack [skip ci]"
          git push origin HEAD:build-learning-cave-v2-direct
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Enable AI reader, guide and bundle first pack
        run: |
          cp android-v2/app/src/main/assets/ai_reader.html android-v2/app/src/main/assets/index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('android-v2/app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          assert '</body>' in s
          s=s.replace('</body>','<script src="guide.js"></script></body>')
          p.write_text(s,encoding='utf-8')
          PY
          rm -rf android-v2/app/src/main/assets/daily
          mkdir -p android-v2/app/src/main/assets/daily
          cp -r daily/* android-v2/app/src/main/assets/daily/
      - name: Build APK
        working-directory: android-v2
        run: gradle :app:assembleDebug --stacktrace
      - name: Validate APK
        run: |
          APK=android-v2/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          unzip -p "$APK" assets/index.html > /tmp/index.html
          grep -q "Ten new journeys every day" /tmp/index.html
          grep -q "aiDailyCache" /tmp/index.html
          grep -q "data-lang=\"mr\"" /tmp/index.html
          grep -q 'script src="guide.js"' /tmp/index.html
          unzip -p "$APK" assets/guide.js >/tmp/guide.js
          grep -q "The Cave Guide" /tmp/guide.js
          grep -q "ज्ञानगुहेचा मार्गदर्शक" /tmp/guide.js
          unzip -l "$APK" | grep -q 'assets/daily/latest.json'
          cp "$APK" Akshads-Learning-Cave-AI-Guide.apk
      - uses: actions/upload-artifact@v4
        with:
          name: akshads-learning-cave-ai-guide-apk
          path: Akshads-Learning-Cave-AI-Guide.apk
          retention-days: 3
